services:
  db:
    image: postgres:16-alpine
    container_name: projetoia-db
    environment:
      POSTGRES_DB: projetoia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d projetoia"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    container_name: projetoia-server
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      CLIENT_URL: http://localhost:8080
      CLIENT_URLS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173
      JWT_SECRET: change-this-secret-in-production
      DATABASE_URL: postgres://postgres:postgres@db:5432/projetoia
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:3001/api
    container_name: projetoia-client
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:
